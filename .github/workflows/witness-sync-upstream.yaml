name: Sync with upstream OpenFGA

on:
  schedule:
    - cron: '0 6 * * 1'  # Weekly on Monday at 6am UTC
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout witness branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: witness
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Ensure issue labels exist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create rebase-conflict --force \
            --color D73A4A \
            --description "Automated upstream rebase failed and needs human attention"
          gh label create test-failure --force \
            --color D73A4A \
            --description "Witness tests failed in an automated workflow"

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/openfga/openfga.git
          git fetch upstream main --tags

      - name: Check if rebase needed
        id: check
        run: |
          UPSTREAM_HEAD=$(git rev-parse upstream/main)
          if git merge-base --is-ancestor "$UPSTREAM_HEAD" HEAD; then
            echo "up_to_date=true" >> "$GITHUB_OUTPUT"
            echo "Already up to date with upstream"
          else
            echo "up_to_date=false" >> "$GITHUB_OUTPUT"
            echo "Upstream has new commits, rebasing..."
          fi

      # README.md is rewritten in the witness branch's docs commit. Upstream
      # edits it frequently, so any upstream README change collides. We
      # auto-resolve README conflicts in favor of the witness version. Any
      # other conflict (typically cmd/run/run.go where our interceptor hook
      # lives) is real and needs a human.
      - name: Rebase witness onto upstream/main
        id: rebase
        if: steps.check.outputs.up_to_date == 'false'
        run: |
          set +e
          git rebase upstream/main
          while [ -d .git/rebase-merge ] || [ -d .git/rebase-apply ]; do
            conflicts=$(git diff --name-only --diff-filter=U)
            if [ -z "$conflicts" ]; then
              echo "::error::Rebase paused with no conflicts visible"
              git rebase --abort
              echo "status=failure" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [ "$conflicts" != "README.md" ]; then
              echo "Conflicts beyond README.md:"
              echo "$conflicts"
              git rebase --abort
              echo "status=failure" >> "$GITHUB_OUTPUT"
              echo "conflicting_files<<EOF" >> "$GITHUB_OUTPUT"
              echo "$conflicts" >> "$GITHUB_OUTPUT"
              echo "EOF" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Auto-resolving README.md (keeping witness version)"
            git checkout --theirs README.md
            git add README.md
            GIT_EDITOR=true git rebase --continue
          done
          echo "status=success" >> "$GITHUB_OUTPUT"
          echo "Rebase complete"

      - name: Set up Go
        if: steps.rebase.outputs.status == 'success'
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: './go.mod'
          cache-dependency-path: './go.sum'

      - name: Run witness tests
        id: tests
        if: steps.rebase.outputs.status == 'success'
        run: |
          go test ./witness/... -timeout 120s -count=1
          go test ./witness_tests/ -timeout 600s -count=1

      - name: Push rebased branch
        if: steps.rebase.outputs.status == 'success'
        run: git push --force-with-lease origin witness

      - name: Push new upstream tags
        if: steps.rebase.outputs.status == 'success' || steps.check.outputs.up_to_date == 'true'
        run: |
          # Only push tags that don't already exist in origin
          for tag in $(git tag -l 'v*' --sort=-version:refname | head -20); do
            if ! git ls-remote --tags origin "refs/tags/$tag" | grep -q "$tag"; then
              echo "Pushing new tag: $tag"
              git push origin "$tag"
            fi
          done

      # Use `gh api` instead of `gh issue create --label` because the latter
      # pre-validates labels and intermittently reports "label not found" right
      # after creation in CI, even though the label exists. Posting the JSON
      # directly bypasses that path.
      - name: Open issue on rebase failure
        if: steps.rebase.outputs.status == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          CONFLICTS: ${{ steps.rebase.outputs.conflicting_files }}
          REPO: ${{ github.repository }}
        run: |
          EXISTING=$(gh issue list --label "rebase-conflict" --state open --json number -q '.[0].number')
          BODY=$(cat <<BODY
          ## Upstream Sync Failed

          The automated rebase of \`witness\` onto \`upstream/main\` failed. README.md conflicts are auto-resolved by CI, so the failure is in another file (typically \`cmd/run/run.go\` where our interceptor and shutdown hooks live).

          **Conflicting files:**
          \`\`\`
          ${CONFLICTS}
          \`\`\`

          See the [workflow run](${RUN_URL}) for full output.

          ### To fix manually
          \`\`\`bash
          git fetch upstream main
          git checkout witness
          git rebase upstream/main
          # README.md auto-resolves locally too if you take "theirs" during rebase.
          # Resolve the listed files by hand — typically merging the upstream
          # changes around our ExtraUnaryInterceptors / OnShutdown hooks.
          git rebase --continue
          go test ./witness/... ./witness_tests/ -timeout 600s
          git push --force-with-lease origin witness
          \`\`\`

          Close this issue once the rebase is resolved.
          BODY
          )
          if [ -n "$EXISTING" ]; then
            gh api "repos/${REPO}/issues/${EXISTING}/comments" \
              -f "body=Rebase still failing — see [run](${RUN_URL}). Conflicting files: \`${CONFLICTS}\`."
          else
            gh api "repos/${REPO}/issues" \
              -f "title=Upstream rebase failed — manual intervention required" \
              -f "body=${BODY}" \
              -f "labels[]=rebase-conflict"
          fi

      - name: Open issue on test failure
        if: steps.rebase.outputs.status == 'success' && failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REPO: ${{ github.repository }}
        run: |
          gh api "repos/${REPO}/issues" \
            -f "title=Witness tests failing after upstream rebase" \
            -f "body=Tests failed after rebasing witness onto upstream/main. See [workflow run](${RUN_URL})." \
            -f "labels[]=test-failure"
