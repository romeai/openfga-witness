name: Release openfga-witness

# Triggered when upstream tags are pushed by the sync workflow,
# or when we manually push a tag.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: 'Upstream tag to release (e.g., v1.13.1)'
        required: true

permissions:
  contents: write
  packages: write

env:
  # Minimum upstream version to build releases for.
  # Older tags won't have compatible code for our witness patches.
  MIN_VERSION: "v1.13.0"

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Determine tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Building release for tag: $TAG"

      - name: Check minimum version
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          MIN="${{ env.MIN_VERSION }}"
          # Compare versions (strip v prefix, use sort -V)
          OLDEST=$(printf '%s\n%s' "${TAG#v}" "${MIN#v}" | sort -V | head -1)
          if [ "$OLDEST" != "${MIN#v}" ] && [ "${TAG#v}" != "${MIN#v}" ]; then
            echo "Tag $TAG is older than minimum $MIN, skipping"
            exit 1
          fi

      - name: Check if release already exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release $TAG already exists, skipping"
            exit 1
          fi

      - name: Checkout witness branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: witness
          fetch-depth: 0

      - name: Set up upstream remote
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/openfga/openfga.git
          git fetch upstream main --tags

      - name: Rebase witness commits onto tag
        id: rebase
        run: |
          TAG="${{ steps.tag.outputs.tag }}"

          # Create a release branch from the witness branch
          git checkout -b "release/$TAG" witness

          # Rebase: take commits between upstream/main and HEAD (our witness commits)
          # and replay them onto the tagged commit
          if git rebase --onto "$TAG" upstream/main; then
            echo "status=success" >> "$GITHUB_OUTPUT"
            echo "Successfully rebased witness onto $TAG"
          else
            echo "status=failure" >> "$GITHUB_OUTPUT"
            git rebase --abort
            echo "::error::Failed to rebase witness commits onto $TAG"
          fi

      - name: Set up Go
        if: steps.rebase.outputs.status == 'success'
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: './go.mod'
          cache-dependency-path: './go.sum'

      - name: Run tests
        if: steps.rebase.outputs.status == 'success'
        run: |
          go test ./witness/... -timeout 120s -count=1
          go test ./witness_tests/ -timeout 600s -count=1

      - name: Build binaries
        if: steps.rebase.outputs.status == 'success'
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          VERSION="${TAG#v}"
          COMMIT=$(git rev-parse --short HEAD)
          DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)

          LDFLAGS="-s -w -X github.com/openfga/openfga/internal/build.Version=$VERSION -X github.com/openfga/openfga/internal/build.Commit=$COMMIT -X github.com/openfga/openfga/internal/build.Date=$DATE"

          mkdir -p dist

          for os in linux darwin; do
            for arch in amd64 arm64; do
              echo "Building ${os}/${arch}..."
              CGO_ENABLED=0 GOOS=$os GOARCH=$arch \
                go build -ldflags "$LDFLAGS" -o "dist/openfga-witness_${os}_${arch}" ./cmd/witness/
            done
          done

          # Create checksums
          cd dist && sha256sum openfga-witness_* > checksums.txt

      - name: Create GitHub Release
        if: steps.rebase.outputs.status == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.tag.outputs.tag }}"

          gh release create "$TAG" \
            --title "openfga-witness $TAG" \
            --generate-notes \
            --notes "$(cat <<NOTES
          ## openfga-witness $TAG

          Built from [OpenFGA $TAG](https://github.com/openfga/openfga/releases/tag/$TAG) with witness audit logging.

          ### What's included
          - All OpenFGA $TAG functionality
          - OCSF API Activity 6003 structured audit events for every gRPC call
          - Pluggable sink architecture (stdout JSON, AWS Data Firehose)
          - Prometheus metrics for audit pipeline health

          ### Quick start
          \`\`\`bash
          # Drop-in replacement for openfga
          openfga-witness run --datastore-engine memory --audit-sink stdout
          \`\`\`

          ### Docker
          \`\`\`bash
          docker pull ghcr.io/${{ github.repository }}:$TAG
          \`\`\`
          NOTES
          )" \
            dist/openfga-witness_* dist/checksums.txt

      - name: Build and push Docker image
        if: steps.rebase.outputs.status == 'success'
        run: |
          TAG="${{ steps.tag.outputs.tag }}"

          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

          docker build -f Dockerfile.witness -t "ghcr.io/${{ github.repository }}:${TAG}" .
          docker tag "ghcr.io/${{ github.repository }}:${TAG}" "ghcr.io/${{ github.repository }}:latest"

          docker push "ghcr.io/${{ github.repository }}:${TAG}"
          docker push "ghcr.io/${{ github.repository }}:latest"

      - name: Report rebase failure
        if: steps.rebase.outputs.status == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          gh issue create \
            --title "Release build failed for $TAG — rebase conflict" \
            --label "release-failure" \
            --body "Failed to rebase witness commits onto upstream tag \`$TAG\`. The interceptor hook in \`cmd/run/run.go\` likely needs manual conflict resolution. See [workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})."
